<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio Lattice — Workspace mockup</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #6e6e6e;
      --line: #e2e2e2;
      --paper: #ffffff;
      --canvas: #fafafa;
      --lime: #e8e8e8;
      --lime-deep: #555555;
      --blue: #252525;
      --blue-soft: #f0f0f0;
      --sidebar: #f5f5f5;
      --sidebar-muted: #777777;
      --shadow: 0 18px 42px rgba(0, 0, 0, .06);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--lime-deep); outline-offset: 3px; }
    a { color: inherit; text-decoration: none; }

    .mockup-note {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: 250px;
      padding: 10px 13px;
      border: 1px solid rgba(23, 35, 31, .12);
      border-radius: 999px;
      color: #4f5b55;
      background: rgba(251, 251, 248, .9);
      box-shadow: 0 10px 25px rgba(23, 35, 31, .08);
      font-size: 12px;
      backdrop-filter: blur(10px);
    }

    .app-frame { min-height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      padding: 0 34px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 251, 248, .82);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.02em;
    }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      color: var(--ink);
      background: var(--lime);
      font-size: 15px;
      font-weight: 900;
    }
    .top-actions { display: flex; align-items: center; gap: 18px; }
    .top-link {
      border: 0;
      padding: 8px 0;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 650;
    }
    .top-link.active, .top-link:hover { color: var(--ink); }
    .avatar {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      font-size: 12px;
      font-weight: 750;
    }

    .page { width: min(1180px, calc(100% - 68px)); margin: 0 auto; padding: 68px 0 100px; }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 680px; margin-bottom: 14px; font-size: clamp(40px, 6vw, 74px); line-height: .98; letter-spacing: -.065em; }
    h2 { margin-bottom: 10px; font-size: 30px; line-height: 1.05; letter-spacing: -.045em; }
    .lede { max-width: 520px; margin-bottom: 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 22px; margin: 66px 0 22px; }
    .section-heading h2 { margin-bottom: 0; font-size: 21px; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 13px; }
    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 999px;
      color: var(--ink);
      background: var(--lime);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(168, 202, 54, .17);
    }
    .primary-button:hover { background: #e4fb83; transform: translateY(-1px); }
    .ghost-button {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
    }
    .ghost-button:hover { background: #fff; }

    .graph-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .graph-card {
      display: flex;
      min-height: 235px;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 4px 14px rgba(23, 35, 31, .025);
      text-align: left;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .graph-card:hover { border-color: #b4c6ad; box-shadow: var(--shadow); transform: translateY(-3px); }
    .graph-card-top { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
    .graph-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 13px;
      color: var(--blue);
      background: var(--blue-soft);
      font-size: 18px;
    }
    .graph-card h3 { margin: 20px 0 8px; font-size: 19px; letter-spacing: -.03em; }
    .graph-card p { max-width: 245px; margin-bottom: 0; color: var(--muted); font-size: 13px; line-height: 1.48; }
    .graph-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; color: var(--muted); font-size: 11px; }
    .status-dot { display: inline-flex; align-items: center; gap: 6px; }
    .status-dot::before { width: 6px; height: 6px; border-radius: 50%; background: var(--lime-deep); content: ""; }

    .workspace-page { width: 100%; padding: 0; }
    .workspace-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 66px;
      padding: 0 27px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    .workspace-context { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .back-button { border: 0; padding: 8px 0; color: var(--muted); background: transparent; font-size: 13px; font-weight: 700; }
    .back-button:hover { color: var(--ink); }
    .divider { width: 1px; height: 20px; background: var(--line); }
    .workspace-name { overflow: hidden; color: var(--ink); font-size: 14px; font-weight: 780; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-bar-actions { display: flex; align-items: center; gap: 8px; }
    .view-switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: #f0f2ec; }
    .view-switch button { min-height: 31px; padding: 0 12px; border: 0; border-radius: 999px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 750; }
    .view-switch button.active { color: var(--ink); background: var(--paper); box-shadow: 0 2px 7px rgba(23, 35, 31, .08); }
    .workspace-shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 66px); }
    .tree {
      padding: 28px 17px;
      color: var(--ink);
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }
    .tree-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 20px; }
    .tree-heading strong { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .tree-heading span { color: var(--sidebar-muted); font-size: 11px; }
    .tree-list { margin: 0; padding: 0; list-style: none; }
    .tree-item { margin: 2px 0; }
    .tree-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      padding: 10px 10px;
      border: 0;
      border-radius: 9px;
      color: #383838;
      background: transparent;
      text-align: left;
      font-size: 13px;
    }
    .tree-row:hover { background: #e9e9e9; }
    .tree-row.selected { color: var(--ink); background: var(--lime); font-weight: 750; }
    .tree-row .caret { width: 12px; color: var(--sidebar-muted); font-size: 11px; }
    .tree-row.selected .caret { color: #657c29; }
    .tree-row .file-icon { width: 16px; color: #8a8a8a; text-align: center; }
    .tree-row.selected .file-icon { color: #63762a; }
    .tree-children { margin: 0 0 4px 21px; padding: 0 0 0 10px; border-left: 1px solid #dddddd; list-style: none; }
    .tree-caption { margin: 32px 10px 10px; color: var(--sidebar-muted); font-size: 10px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    .tree-help { margin: 30px 10px 0; padding-top: 18px; border-top: 1px solid #dddddd; color: var(--sidebar-muted); font-size: 12px; line-height: 1.5; }

    .content-pane { min-width: 0; background: var(--paper); }
    .content-inner { width: min(780px, calc(100% - 72px)); margin: 0 auto; padding: 64px 0 100px; }
    .content-breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; color: var(--muted); font-size: 12px; }
    .content-breadcrumb strong { color: var(--ink); font-weight: 700; }
    .document-card { padding: 0 0 100px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .document-card h1 { max-width: none; margin-bottom: 18px; font-size: clamp(34px, 5vw, 55px); }
    .document-summary { max-width: 610px; margin-bottom: 30px; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .document-rule { height: 1px; margin: 32px 0; background: var(--line); }
    .document-card h2 { margin: 0 0 14px; font-size: 21px; }
    .document-card p { max-width: 620px; color: #4f5a54; font-size: 15px; line-height: 1.7; }
    .document-card ul { max-width: 620px; margin: 0; padding-left: 20px; color: #4f5a54; font-size: 15px; line-height: 1.9; }
    .edit-page { max-width: 780px; padding-bottom: 100px; }
    .edit-page h1 { max-width: none; margin-bottom: 10px; font-size: clamp(34px, 5vw, 55px); }
    .edit-page .edit-intro { margin-bottom: 28px; color: var(--muted); font-size: 14px; }
    .edit-textarea { display: block; width: 100%; min-height: 420px; resize: vertical; padding: 18px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fafafa; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.65; }
    .edit-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .edit-actions .saved { color: #5f6b62; font-size: 12px; }
    .share-sheet { position: fixed; top: 78px; right: 28px; z-index: 10; width: min(360px, calc(100% - 32px)); padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: #ffffff; box-shadow: 0 18px 42px rgba(0, 0, 0, .14); }
    .share-sheet h2 { margin-bottom: 6px; font-size: 18px; }
    .share-sheet p { margin-bottom: 17px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .share-sheet label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 750; }
    .share-sheet input { width: 100%; min-height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fafafa; font-size: 12px; }
    .share-sheet-actions { display: flex; justify-content: end; gap: 8px; margin-top: 16px; }
    .graph-content { width: min(1100px, calc(100% - 72px)); }
    .graph-view-heading { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 28px; }
    .graph-view-heading h1 { max-width: none; margin: 0 0 9px; font-size: clamp(34px, 5vw, 56px); }
    .graph-view-heading p { max-width: 580px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .graph-view-heading .doc-meta { margin: 0; justify-content: end; }
    .graph-map { position: relative; min-height: 570px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background-color: var(--paper); background-image: radial-gradient(#d6ddd2 1px, transparent 1px); background-size: 23px 23px; box-shadow: var(--shadow); }
    .graph-map::after { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(251, 251, 248, .92), rgba(251, 251, 248, .15) 45%, rgba(251, 251, 248, .78)); content: ""; pointer-events: none; }
    .graph-map svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    .graph-map line { stroke: #b6c3b6; stroke-width: 1.5; stroke-dasharray: 5 6; }
    .graph-map text { fill: #77877d; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .graph-node { position: absolute; z-index: 2; width: 194px; padding: 14px; border: 1px solid #d7dfd5; border-radius: 14px; color: var(--ink); background: rgba(251, 251, 248, .96); box-shadow: 0 8px 20px rgba(23, 35, 31, .08); text-align: left; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
    .graph-node:hover, .graph-node:focus-visible { border-color: #a8ca36; box-shadow: 0 13px 26px rgba(23, 35, 31, .13); transform: translateY(-3px); }
    .graph-node.selected { border-color: var(--lime-deep); box-shadow: 0 0 0 4px rgba(216, 243, 106, .3), 0 13px 26px rgba(23, 35, 31, .12); }
    .graph-node small { display: block; margin-bottom: 9px; color: var(--blue); font-size: 10px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .graph-node strong { display: block; margin-bottom: 6px; font-size: 14px; letter-spacing: -.02em; }
    .graph-node span { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .node-brief { top: 38%; left: 37%; }
    .node-research { top: 14%; left: 10%; }
    .node-decisions { top: 65%; left: 10%; }
    .node-site { top: 26%; right: 9%; }
    .graph-map-note { position: absolute; right: 18px; bottom: 16px; z-index: 3; color: var(--muted); font-size: 11px; }
    .graph-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 15px; color: var(--muted); font-size: 11px; }
    .graph-legend span { display: inline-flex; align-items: center; gap: 7px; }
    .graph-legend span::before { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); content: ""; }
    .graph-legend span:nth-child(2)::before { background: var(--lime-deep); }
    .graph-legend span:nth-child(3)::before { background: #b6c3b6; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
    .pill { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 999px; color: #53605a; background: #edf0e9; font-size: 11px; font-weight: 700; }
    .pill.blue { color: var(--blue); background: var(--blue-soft); }
    .file-meta { margin: 0 0 31px; color: var(--muted); font-size: 12px; }
    .site-callout { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 32px; padding: 17px 18px; border: 1px solid #d3dfb2; border-radius: 14px; background: #f6fadd; }
    .site-callout strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .site-callout span { color: #687256; font-size: 12px; }
    .site-inline-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 15px; }
    .site-inline-label { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .site-inline-label::before { width: 7px; height: 7px; border-radius: 50%; background: var(--lime-deep); content: ""; }
    .site-preview { overflow: hidden; min-height: 620px; border: 0; border-radius: 0; background: #ffffff; box-shadow: none; }
    .site-preview-bar { display: none; }
    .site-preview-bar i { width: 7px; height: 7px; border-radius: 50%; background: #b3b3b3; }
    .site-preview-canvas { display: grid; min-height: 587px; place-items: center; padding: 42px; background: #ffffff; }
    .site-preview-inner { width: min(640px, 100%); }
    .site-preview-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 115px; color: #b8c8bd; font-size: 11px; }
    .site-preview-logo { color: var(--ink); font-weight: 850; }
    .site-preview-logo span { display: inline-block; width: 6px; height: 6px; margin-left: 3px; border-radius: 50%; background: #777777; }
    .site-preview-links { display: flex; gap: 17px; color: #777777; }
    .site-preview-kicker { margin-bottom: 13px; color: #777777; font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .site-preview h2 { max-width: 590px; margin-bottom: 17px; color: var(--ink); font-size: clamp(35px, 5vw, 64px); line-height: .93; letter-spacing: -.06em; }
    .site-preview p { max-width: 390px; margin-bottom: 22px; color: #5d5d5d; font-size: 13px; line-height: 1.55; }
    .site-preview-cta { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 1px solid #222222; border-radius: 999px; color: #ffffff; background: #222222; font-size: 11px; font-weight: 800; }

    .standalone { min-height: 100vh; color: var(--ink); background: #ffffff; }
    .standalone-site { display: grid; min-height: 100vh; grid-template-rows: 1fr auto; overflow: hidden; }
    .site-hero { display: grid; place-items: center; padding: 70px 30px; background: #ffffff; }
    .site-hero-inner { width: min(890px, 100%); }
    .site-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20vh; }
    .site-logo { font-size: 15px; font-weight: 850; letter-spacing: -.02em; }
    .site-logo span { display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; background: #777777; }
    .site-nav-links { display: flex; gap: 22px; color: #777777; font-size: 12px; }
    .site-kicker { margin-bottom: 15px; color: #777777; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .site-hero h1 { max-width: 790px; margin-bottom: 24px; color: var(--ink); font-size: clamp(48px, 8vw, 100px); line-height: .9; }
    .site-hero p { max-width: 480px; margin-bottom: 26px; color: #5d5d5d; font-size: 16px; line-height: 1.55; }
    .site-cta { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #222222; border-radius: 999px; color: #ffffff; background: #222222; font-size: 13px; font-weight: 800; }
    .site-footer { display: flex; justify-content: space-between; gap: 20px; padding: 22px 30px; color: #777777; background: #f5f5f5; font-size: 11px; }

    .hidden { display: none !important; }
    @media (max-width: 820px) {
      .topbar { min-height: 64px; padding: 0 18px; }
      .top-actions { gap: 10px; }
      .top-link { display: none; }
      .page { width: min(100% - 36px, 620px); padding-top: 48px; }
      .section-heading { align-items: start; flex-direction: column; margin-top: 48px; }
      .graph-grid { grid-template-columns: 1fr; }
      .workspace-shell { grid-template-columns: 224px minmax(0, 1fr); }
      .workspace-bar { padding: 0 16px; }
      .workspace-bar-actions { display: flex; }
      .workspace-bar-actions > .header-secondary { display: none; }
      .content-inner { width: calc(100% - 30px); padding-top: 34px; }
      .document-card { padding: 26px 22px; }
      .graph-content { width: calc(100% - 30px); }
      .graph-view-heading { align-items: start; flex-direction: column; }
      .graph-view-heading .doc-meta { justify-content: start; }
      .graph-map { min-height: 530px; }
      .site-preview-canvas { padding: 30px 22px; }
      .site-preview-nav { margin-bottom: 80px; }
      .site-nav { margin-bottom: 16vh; }
      .site-nav-links { display: none; }
    }
    @media (max-width: 590px) {
      .workspace-shell { display: block; }
      .tree { min-height: auto; padding: 17px 12px; }
      .tree-list { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
      .tree-item { flex: 0 0 auto; }
      .tree-item > .tree-children, .tree-caption, .tree-help { display: none; }
      .tree-row { white-space: nowrap; }
      .content-inner { width: calc(100% - 24px); }
      .graph-content { width: calc(100% - 24px); }
      .graph-map { min-height: 590px; }
      .graph-node { width: 164px; }
      .node-brief { top: 40%; left: 26%; }
      .node-research { top: 11%; left: 3%; }
      .node-decisions { top: 68%; left: 3%; }
      .node-site { top: 24%; right: 3%; }
      .site-footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="mockup-note" class="mockup-note">Mockup only · graph picker</div>
  <script>
    const graphs = [
      { id: 'product', name: 'Product intelligence', description: 'The decisions, research, and source material behind the product.', count: '24 items', updated: 'Updated today', tone: 'lime' },
      { id: 'hyperset', name: 'Hyperset knowledge base', description: 'A living map of trusted context for agents and teammates.', count: '61 items', updated: 'Updated yesterday', tone: 'blue' },
      { id: 'launch', name: 'Launch room', description: 'Campaign pages, briefs, checklists, and the live launch site.', count: '18 items', updated: 'Updated Sep 8', tone: 'purple' }
    ];

    const files = {
      brief: { name: 'Product brief.md', type: 'Markdown', title: 'Product brief', kind: 'doc' },
      research: { name: 'Research notes.md', type: 'Markdown', title: 'Research notes', kind: 'doc' },
      site: { name: 'Launch site.html', type: 'Website', title: 'Launch site', kind: 'site' },
      readme: { name: 'README.md', type: 'Markdown', title: 'README', kind: 'doc' },
      decisions: { name: 'Decision log.md', type: 'Markdown', title: 'Decision log', kind: 'doc' }
    };
    window.selectedFile = 'brief';
    window.workspaceView = 'read';
    window.editing = false;
    window.shareOpen = false;
    window.saved = false;

    function route() {
      const value = location.hash.replace(/^#/, '') || 'graphs';
      if (value === 'standalone') return 'standalone';
      if (value === 'workspace/site') { window.selectedFile = 'site'; window.workspaceView = 'read'; return 'workspace'; }
      if (value === 'workspace/graph') { window.workspaceView = 'graph'; return 'workspace'; }
      if (value.startsWith('workspace')) return 'workspace';
      return 'graphs';
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

    function graphPicker() {
      return `<div class="app-frame">
        <header class="topbar">
          <a class="brand" href="#graphs" aria-label="Folio Lattice home"><span class="brand-mark">⌁</span><span>folio / lattice</span></a>
          <nav class="top-actions" aria-label="Primary navigation"><button class="top-link active" type="button">Graphs</button><button class="top-link" type="button">Shared with me</button><span class="avatar" aria-label="Brandon's account">BS</span></nav>
        </header>
        <main class="page" id="main">
          <p class="eyebrow">Your knowledge space</p>
          <h1>Start with a graph.</h1>
          <p class="lede">Everything you and your agents are building, arranged around the work—not the machinery underneath.</p>
          <div class="section-heading"><div><h2>Your graphs</h2><p>Open a graph to browse its folders and artifacts.</p></div><button class="primary-button" type="button" onclick="alert('New graph flow is next in the mockup.')">＋ New graph</button></div>
          <section class="graph-grid" aria-label="Your graphs">${graphs.map(graph => `<button class="graph-card" type="button" onclick="openGraph('${graph.id}')"><span><span class="graph-card-top"><span class="graph-icon">${graph.id === 'hyperset' ? '◒' : graph.id === 'launch' ? '↗' : '✦'}</span><span aria-hidden="true">↗</span></span><h3>${graph.name}</h3><p>${graph.description}</p></span><span class="graph-meta"><span class="status-dot">${graph.count}</span><span>${graph.updated}</span></span></button>`).join('')}</section>
          <div class="section-heading"><div><h2>Shared with you</h2><p>Graphs your teammates have invited you into.</p></div></div>
          <section class="graph-grid" aria-label="Shared graphs"><button class="graph-card" type="button" onclick="openGraph('launch')"><span><span class="graph-card-top"><span class="graph-icon">◎</span><span aria-hidden="true">↗</span></span><h3>Customer discovery</h3><p>Interview notes and emerging themes from the field team.</p></span><span class="graph-meta"><span class="status-dot">12 items</span><span>Shared by Maya</span></span></button></section>
        </main>
      </div>`;
    }

    function treeRow(id, label, icon, selected = false, indent = false) {
      return `<li class="tree-item"><button class="tree-row${selected ? ' selected' : ''}" type="button" onclick="selectFile('${id}')"><span class="caret">${icon === 'folder' ? '⌄' : ''}</span><span class="file-icon" aria-hidden="true">${icon === 'folder' ? '□' : '·'}</span><span>${label}</span></button></li>`;
    }

    function graphView() {
      const selected = window.selectedFile || 'brief';
      return `<div class="content-inner graph-content"><div class="content-breadcrumb"><span>Product intelligence</span><span>/</span><strong>Graph view</strong></div><div class="graph-view-heading"><div><p class="eyebrow">Relationship map</p><h1>Product intelligence</h1><p>See how the work connects. Select a node to open that artifact in the reading pane.</p></div><div class="doc-meta"><span class="pill">4 artifacts</span><span class="pill blue">3 links</span></div></div><section class="graph-map" aria-label="Product intelligence relationship map"><svg viewBox="0 0 1000 570" preserveAspectRatio="none" aria-hidden="true"><line x1="235" y1="160" x2="470" y2="280"></line><line x1="235" y1="415" x2="470" y2="280"></line><line x1="665" y1="205" x2="530" y2="280"></line><text x="330" y="202">informs</text><text x="330" y="388">supports</text><text x="573" y="202">published as</text></svg><button class="graph-node node-brief${selected === 'brief' ? ' selected' : ''}" type="button" onclick="selectFile('brief')"><small>Markdown</small><strong>Product brief.md</strong><span>The central product narrative</span></button><button class="graph-node node-research${selected === 'research' ? ' selected' : ''}" type="button" onclick="selectFile('research')"><small>Markdown</small><strong>Research notes.md</strong><span>Evidence from customer discovery</span></button><button class="graph-node node-decisions${selected === 'decisions' ? ' selected' : ''}" type="button" onclick="selectFile('decisions')"><small>Markdown</small><strong>Decision log.md</strong><span>Why the team chose this path</span></button><button class="graph-node node-site${selected === 'site' ? ' selected' : ''}" type="button" onclick="selectFile('site')"><small>Website</small><strong>Launch site.html</strong><span>The public-facing artifact</span></button><span class="graph-map-note">Click a node to read it</span></section><div class="graph-legend"><span>Selected artifact</span><span>Connected artifact</span><span>Relationship</span></div></div>`;
    }

    function sitePreview() {
      return `<div class="content-inner"><div class="content-breadcrumb"><span>Product intelligence</span><span>/</span><span>03 · Published</span><span>/</span><strong>Launch site.html</strong></div><div class="site-inline-toolbar"><span class="site-inline-label">Rendered website</span><button class="ghost-button" type="button" onclick="openStandalone()">Open standalone ↗</button></div><section class="site-preview" aria-label="Rendered Launch site website"><div class="site-preview-bar"><i></i><i></i><i></i><span>Launch site.html</span></div><div class="site-preview-canvas"><div class="site-preview-inner"><nav class="site-preview-nav"><span class="site-preview-logo">northstar<span></span></span><span class="site-preview-links"><span>About</span><span>Notes</span><span>Contact</span></span></nav><div class="site-preview-kicker">A website artifact</div><h2>Make room for the work that matters.</h2><p>A small, calm place for teams to gather the context behind their best decisions.</p><span class="site-preview-cta">Explore the idea →</span></div></div></section></div>`;
    }

    function editView(file) {
      const source = file.kind === 'site' ? '<!doctype html>\n<html>\n  <body>\n    <h1>Make room for the work that matters.</h1>\n  </body>\n</html>' : `# ${file.title}\n\nA readable artifact inside the Product intelligence graph.\n\n## The core idea\n\n- Context should be readable without opening an IDE.\n- Every write should leave a recoverable version.`;
      return `<div class="content-inner edit-page"><div class="content-breadcrumb"><span>Product intelligence</span><span>/</span><strong>Edit ${escapeHtml(file.name)}</strong></div><p class="eyebrow">New version</p><h1>Edit ${escapeHtml(file.name)}</h1><p class="edit-intro">Make a change here and save it as a new version. The current version stays recoverable.</p><textarea class="edit-textarea" aria-label="Edit artifact content">${escapeHtml(source)}</textarea><div class="edit-actions"><button class="primary-button" type="button" onclick="saveChanges()">Save new version</button><button class="ghost-button" type="button" onclick="toggleEdit()">Cancel</button>${window.saved ? '<span class="saved">Saved as a new version.</span>' : ''}</div></div>`;
    }

    function shareSheet() {
      return `<section class="share-sheet" role="dialog" aria-labelledby="share-title"><h2 id="share-title">Share this artifact</h2><p>Invite teammates to read or edit this artifact. Sharing stays scoped to the graph.</p><label for="share-person">People or groups</label><input id="share-person" value="name@company.com" aria-label="People or groups"><div class="share-sheet-actions"><button class="ghost-button" type="button" onclick="toggleShare()">Cancel</button><button class="primary-button" type="button" onclick="toggleShare()">Send invite</button></div></section>`;
    }

    function workspace() {
      const selected = window.selectedFile || 'brief';
      const file = files[selected];
      const view = window.workspaceView || 'read';
      const documentContent = selected === 'research'
        ? `<h2>What we know</h2><p>Teams need a shared place where agents can find the source behind a decision, follow the links, and leave the work better than they found it.</p><ul><li>Context should be readable without opening an IDE.</li><li>Every write should leave a recoverable version.</li><li>Sharing should follow the graph, not fight it.</li></ul>`
        : selected === 'readme'
          ? `<h2>Welcome to the graph</h2><p>This is a quiet workspace for the things that matter to the team. Choose a file on the left to read it here.</p>`
          : `<h2>The core idea</h2><p>Folio Lattice gives people and agents one shared surface for connected knowledge. A graph is the container; folders are the familiar way through it; artifacts are the things you actually want to read.</p><p>Open a document in place. Open a website as a website. The system should disappear behind the work.</p>`;
      return `<div class="workspace-page">
        <header class="workspace-bar"><div class="workspace-context"><button class="back-button" type="button" onclick="goGraphs()">← Graphs</button><span class="divider" aria-hidden="true"></span><strong class="workspace-name">Product intelligence</strong></div><div class="workspace-bar-actions"><div class="view-switch" role="tablist" aria-label="Workspace view"><button class="${view === 'read' ? 'active' : ''}" type="button" role="tab" aria-selected="${view === 'read'}" onclick="setWorkspaceView('read')">Read</button><button class="${view === 'graph' ? 'active' : ''}" type="button" role="tab" aria-selected="${view === 'graph'}" onclick="setWorkspaceView('graph')">Graph</button></div><button class="ghost-button" type="button" onclick="toggleShare()">Share</button><button class="ghost-button" type="button" onclick="toggleEdit()">${window.editing ? 'Close edit' : 'Edit'}</button><button class="ghost-button header-secondary" type="button">Search graph</button><button class="primary-button header-secondary" type="button">＋ New</button></div></header>
        <div class="workspace-shell">
          <aside class="tree" aria-label="Product intelligence folders and files"><div class="tree-heading"><strong>Product intelligence</strong><span>24 items</span></div><ul class="tree-list">
            ${treeRow('root', 'Overview', 'folder', false)}
            <li class="tree-item"><button class="tree-row" type="button"><span class="caret">⌄</span><span class="file-icon" aria-hidden="true">□</span><span>01 · Foundation</span></button><ul class="tree-children">${treeRow('brief', 'Product brief.md', 'file', selected === 'brief')}${treeRow('research', 'Research notes.md', 'file', selected === 'research')}</ul></li>
            <li class="tree-item"><button class="tree-row" type="button"><span class="caret">⌄</span><span class="file-icon" aria-hidden="true">□</span><span>02 · Decisions</span></button><ul class="tree-children">${treeRow('decisions', 'Decision log.md', 'file', selected === 'decisions')}</ul></li>
            <li class="tree-item"><button class="tree-row" type="button"><span class="caret">⌄</span><span class="file-icon" aria-hidden="true">□</span><span>03 · Published</span></button><ul class="tree-children">${treeRow('site', 'Launch site.html', 'file', selected === 'site')}</ul></li>
            ${treeRow('readme', 'README.md', 'file', selected === 'readme')}
          </ul><p class="tree-caption">Graph tools</p><button class="tree-row" type="button"><span class="caret"></span><span class="file-icon">⌕</span><span>Search this graph</span></button><p class="tree-help">Folders are just a familiar view over the graph. Links between artifacts stay intact.</p></aside>
          <main class="content-pane">${view === 'graph' ? graphView() : window.editing ? editView(file) : file.kind === 'site' ? sitePreview() : `<div class="content-inner"><div class="content-breadcrumb"><span>Product intelligence</span><span>/</span><span>01 · Foundation</span><span>/</span><strong>${escapeHtml(file.name)}</strong></div><article class="document-card"><p class="file-meta">${file.type} · Current version · Updated today</p><h1>${escapeHtml(file.title)}</h1><p class="document-summary">A readable artifact inside the Product intelligence graph.</p><div class="document-rule"></div>${documentContent}</article></div>`}</main>
        </div>
        ${window.shareOpen ? shareSheet() : ''}
      </div>`;
    }

    function standalone() {
      return `<div class="standalone-site"><main class="site-hero"><div class="site-hero-inner"><nav class="site-nav"><span class="site-logo">northstar<span></span></span><div class="site-nav-links"><span>About</span><span>Notes</span><span>Contact</span></div></nav><div class="site-kicker">A website artifact</div><h1>Make room for the work that matters.</h1><p>A small, calm place for teams to gather the context behind their best decisions.</p><a class="site-cta" href="#" onclick="return false">Explore the idea →</a></div></main><footer class="site-footer"><span>northstar / launch site</span><span>Built inside Folio Lattice</span></footer></div>`;
    }

    function render() {
      const current = route();
      const app = document.getElementById('app');
      const note = document.getElementById('mockup-note');
      if (current === 'standalone') { document.body.className = 'standalone'; app.innerHTML = standalone(); note.classList.add('hidden'); return; }
      document.body.className = ''; app.innerHTML = current === 'workspace' ? workspace() : graphPicker(); note.classList.remove('hidden'); note.textContent = current === 'workspace' ? 'Mockup only · graph workspace' : 'Mockup only · graph picker';
    }
    function goGraphs() { window.editing = false; window.shareOpen = false; history.pushState({}, '', '#graphs'); render(); }
    function openGraph(id) { window.selectedFile = id === 'launch' ? 'site' : 'brief'; window.workspaceView = 'read'; window.editing = false; window.shareOpen = false; history.pushState({}, '', '#workspace'); render(); }
    function selectFile(id) { if (id === 'root') return; window.selectedFile = id; window.workspaceView = 'read'; window.editing = false; window.shareOpen = false; history.replaceState({}, '', '#workspace'); render(); }
    function setWorkspaceView(view) { window.workspaceView = view; window.editing = false; window.shareOpen = false; history.replaceState({}, '', '#workspace'); render(); }
    function toggleEdit() { window.editing = !window.editing; window.shareOpen = false; window.saved = false; render(); }
    function toggleShare() { window.shareOpen = !window.shareOpen; window.editing = false; render(); }
    function saveChanges() { window.editing = false; window.saved = true; render(); }
    function openStandalone() { history.pushState({}, '', '#standalone'); render(); }
    window.addEventListener('popstate', render);
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
