name: folio-lattice-local

services:
  folio:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:?VCS_REF is required for an immutable image revision}
    user: "10001:10001"
    ports:
      - "127.0.0.1:${FOLIO_HOST_PORT:-8000}:8000"
    environment:
      FOLIO_DB_PATH: /data/folio.db
      FOLIO_BLOB_ROOT: /data/blobs
      FOLIO_TENANT_ID: ${FOLIO_TENANT_ID:-hyperset-v0}
      FOLIO_ACTOR: ${FOLIO_ACTOR:-hyperset}
      FOLIO_DEPLOYMENT_MODE: local
      FOLIO_MCP_URL: http://folio:8000/mcp
      FOLIO_CONTROL_ORIGIN: http://127.0.0.1:${FOLIO_HOST_PORT:-8000}
      FOLIO_RENDER_ORIGIN: http://127.0.0.1:${FOLIO_RENDER_HOST_PORT:-8001}
      FOLIO_TENANT_RATE_LIMIT: ${FOLIO_TENANT_RATE_LIMIT:-600}
      FOLIO_ACTOR_RATE_LIMIT: ${FOLIO_ACTOR_RATE_LIMIT:-600}
      FOLIO_IP_RATE_LIMIT: ${FOLIO_IP_RATE_LIMIT:-600}
      FOLIO_RATE_LIMIT_WINDOW_SECONDS: ${FOLIO_RATE_LIMIT_WINDOW_SECONDS:-60}
      FOLIO_RESOURCE_CONCURRENCY_LIMIT: ${FOLIO_RESOURCE_CONCURRENCY_LIMIT:-32}
      FOLIO_RESOURCE_CONCURRENCY_PER_KEY: ${FOLIO_RESOURCE_CONCURRENCY_PER_KEY:-8}
      FOLIO_RESOURCE_TIMEOUT_SECONDS: ${FOLIO_RESOURCE_TIMEOUT_SECONDS:-30}
      FOLIO_RESOURCE_MAX_RESPONSE_BYTES: ${FOLIO_RESOURCE_MAX_RESPONSE_BYTES:-1048576}
      FOLIO_RENDERER_CAPABILITY_SECRET: ${FOLIO_RENDERER_CAPABILITY_SECRET:?set a shared renderer capability secret}
    volumes:
      - folio_data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  renderer:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:?VCS_REF is required for an immutable image revision}
    user: "10001:10001"
    command: ["python", "-m", "folio_lattice.server", "--transport", "renderer", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:${FOLIO_RENDER_HOST_PORT:-8001}:8001"
    environment:
      FOLIO_DEPLOYMENT_MODE: local
      FOLIO_MCP_URL: http://folio:8000/mcp
      FOLIO_TENANT_ID: ${FOLIO_TENANT_ID:-hyperset-v0}
      FOLIO_ACTOR: ${FOLIO_ACTOR:-hyperset}
      FOLIO_CONTROL_ORIGIN: http://127.0.0.1:${FOLIO_HOST_PORT:-8000}
      FOLIO_TENANT_RATE_LIMIT: ${FOLIO_TENANT_RATE_LIMIT:-600}
      FOLIO_ACTOR_RATE_LIMIT: ${FOLIO_ACTOR_RATE_LIMIT:-600}
      FOLIO_IP_RATE_LIMIT: ${FOLIO_IP_RATE_LIMIT:-600}
      FOLIO_RATE_LIMIT_WINDOW_SECONDS: ${FOLIO_RATE_LIMIT_WINDOW_SECONDS:-60}
      FOLIO_RESOURCE_CONCURRENCY_LIMIT: ${FOLIO_RESOURCE_CONCURRENCY_LIMIT:-32}
      FOLIO_RESOURCE_CONCURRENCY_PER_KEY: ${FOLIO_RESOURCE_CONCURRENCY_PER_KEY:-8}
      FOLIO_RESOURCE_TIMEOUT_SECONDS: ${FOLIO_RESOURCE_TIMEOUT_SECONDS:-30}
      FOLIO_RESOURCE_MAX_RESPONSE_BYTES: ${FOLIO_RESOURCE_MAX_RESPONSE_BYTES:-1048576}
      FOLIO_RENDERER_CAPABILITY_SECRET: ${FOLIO_RENDERER_CAPABILITY_SECRET:?set a shared renderer capability secret}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      folio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

volumes:
  folio_data:
