name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked development environment
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy

      - name: Test with coverage
        run: >-
          uv run pytest
          --ignore=tests/test_browser_e2e.py
          --cov=folio_lattice
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

  browser:
    name: Browser contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked test environment
        run: uv sync --locked --dev --python 3.12

      - name: Exercise real browser contract
        run: uv run pytest -q tests/test_browser_e2e.py

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked test environment
        run: uv sync --locked --dev --python 3.12

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker compose build

      - name: Start service and wait for health
        run: docker compose up -d --wait

      - name: Check health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Exercise MCP contract
        run: uv run python tests/test_docker_e2e.py

      - name: Tear down
        if: always()
        run: docker compose down -v
